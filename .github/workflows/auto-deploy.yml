name: Auto Deploy Trigger

on:
  push:
    branches:
      - "**" # Matches all branches

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest

    # Skip if the commit message contains [skip ci] to prevent infinite loops
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DEPLOY_PAT }}
          ref: ${{ github.ref }}

      - name: Setup Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Append dot to file
        run: |
          echo "." >> deploy-trigger.txt

      - name: Commit and push if changed
        run: |
          git add deploy-trigger.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: trigger deploy [skip ci]" && git push)
